<script>

/* ==================================================
   TANGGAL OTOMATIS
================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    const today =
      new Date()
        .toISOString()
        .split("T")[0];

    document.getElementById(
      "tanggal"
    ).value = today;


    /*
     * Ambil daftar ID Order Artikel
     */

    if(
      typeof google !== "undefined" &&
      google.script &&
      google.script.run
    ){

      google.script.run

        .withSuccessHandler(
          isiDropdownOrder
        )

        .withFailureHandler(
          function(error){

            console.error(
              "Gagal mengambil daftar order:",
              error
            );

            alert(
              "Gagal mengambil daftar order artikel:\n" +
              (
                error &&
                error.message
                  ? error.message
                  : error
              )
            );

          }
        )

        .ambilDaftarOrderArtikel();

    }

  }
);


/* ==================================================
   ISI DROPDOWN ORDER
================================================== */

function isiDropdownOrder(data){

  const select =
    document.getElementById(
      "idOrder"
    );


  select.innerHTML =
    `
    <option value="">
      Pilih ID Order Artikel
    </option>
    `;


  /*
   * Antisipasi backend mengembalikan:
   *
   * [
   *   {...},
   *   {...}
   * ]
   *
   * atau:
   *
   * {
   *   data:[...]
   * }
   */

  let orders = data;


  if(
    data &&
    !Array.isArray(data) &&
    Array.isArray(data.data)
  ){

    orders =
      data.data;

  }


  if(!Array.isArray(orders)){

    console.error(
      "Format daftar order tidak valid:",
      data
    );

    return;

  }


  if(orders.length === 0){

    select.innerHTML =
      `
      <option value="">
        Belum ada ID Order Artikel
      </option>
      `;

    return;

  }


  orders.forEach(
    function(item){

      if(!item){
        return;
      }


      const option =
        document.createElement(
          "option"
        );


      /*
       * Jika backend mengembalikan object
       */

      if(
        typeof item === "object"
      ){

        const idOrder =
          item.idOrder ||
          item.orderId ||
          item.ID_Order ||
          item["ID Order"] ||
          "";


        const judulArtikel =
          item.judulArtikel ||
          item.judul ||
          item["Judul Artikel"] ||
          "";


        if(!idOrder){
          return;
        }


        option.value =
          idOrder;


        option.textContent =
          idOrder +
          (
            judulArtikel
              ? " — " + judulArtikel
              : ""
          );

      }

      /*
       * Jika backend hanya mengembalikan string ID
       */

      else{

        option.value =
          item;

        option.textContent =
          item;

      }


      select.appendChild(
        option
      );

    }
  );

}


/* ==================================================
   AMBIL DETAIL ORDER
================================================== */

function ambilDetailOrder(){

  const idOrder =
    document.getElementById(
      "idOrder"
    ).value;


  const judul =
    document.getElementById(
      "judulArtikel"
    );


  const kodeJurnal =
    document.getElementById(
      "kodeJurnal"
    );


  const bulanTerbit =
    document.getElementById(
      "bulanTerbit"
    );


  const penulis =
    document.getElementById(
      "idPenulis"
    );


  const namaPenulis =
    document.getElementById(
      "namaPenulis"
    );


  const penulisKe =
    document.getElementById(
      "penulisKe"
    );


  /*
   * Reset semua field
   */

  judul.value = "";

  kodeJurnal.value = "";

  bulanTerbit.value = "";

  namaPenulis.value = "";

  penulisKe.value = "";


  penulis.innerHTML =
    `
    <option value="">
      Memuat Penulis...
    </option>
    `;


  if(!idOrder){

    penulis.innerHTML =
      `
      <option value="">
        Pilih Penulis
      </option>
      `;

    return;

  }


  console.log(
    "AMBIL DETAIL ORDER ARTIKEL:",
    idOrder
  );


  /*
   * Ambil data Order Artikel
   */

  if(
    typeof google === "undefined" ||
    !google.script ||
    !google.script.run
  ){

    return;

  }


  google.script.run

    .withSuccessHandler(
      function(data){

        console.log(
          "DETAIL ORDER ARTIKEL:",
          data
        );


        if(!data){

          penulis.innerHTML =
            `
            <option value="">
              Data Order tidak ditemukan
            </option>
            `;

          return;

        }


        /*
         * Jika backend mengembalikan:
         *
         * {
         *   success:false,
         *   message:"..."
         * }
         */

        if(
          data.success === false
        ){

          penulis.innerHTML =
            `
            <option value="">
              Gagal mengambil Penulis
            </option>
            `;

          alert(
            data.message ||
            "Gagal mengambil detail Order Artikel."
          );

          return;

        }


        /*
         * ==========================================
         * JUDUL ARTIKEL
         * ==========================================
         */

        judul.value =
          data.judulArtikel ||
          data.judul ||
          data["Judul Artikel"] ||
          "";


        /*
         * ==========================================
         * KODE JURNAL
         * ==========================================
         */

        kodeJurnal.value =
          data.kodeJurnal ||
          data.kode_jurnal ||
          data["Kode Jurnal"] ||
          "";


        /*
         * ==========================================
         * BULAN TERBIT
         * ==========================================
         */

        bulanTerbit.value =
          data.bulanTerbit ||
          data.bulan_terbit ||
          data["Bulan Terbit"] ||
          "";


        /*
         * ==========================================
         * AMBIL DAFTAR PENULIS
         * ==========================================
         *
         * Backend idealnya mengembalikan:
         *
         * data.penulis = [
         *   {
         *     idPenulis: "...",
         *     namaPenulis: "...",
         *     penulisKe: 1
         *   }
         * ]
         */

        let daftarPenulis =
          data.penulis ||
          data.penulisArtikel ||
          data.authors ||
          data.author ||
          [];


        /*
         * Antisipasi jika backend:
         *
         * data.data.penulis
         */

        if(
          !Array.isArray(daftarPenulis) &&
          data.data &&
          Array.isArray(data.data.penulis)
        ){

          daftarPenulis =
            data.data.penulis;

        }


        /*
         * ==========================================
         * JIKA PENULIS ADA
         * ==========================================
         */

        if(
          Array.isArray(daftarPenulis) &&
          daftarPenulis.length > 0
        ){

          isiDropdownPenulis(
            daftarPenulis
          );

          return;

        }


        /*
         * ==========================================
         * FALLBACK
         * ==========================================
         *
         * Jika ambilOrderArtikelUntukInvoice()
         * tidak mengirim data penulis, coba ambil
         * daftar penulis berdasarkan ID ORDER.
         */

        console.warn(
          "Data penulis tidak ada di detail order. " +
          "Mencoba mengambil berdasarkan ID Order."
        );


        ambilPenulisBerdasarkanOrder(
          idOrder
        );

      }
    )

    .withFailureHandler(
      function(error){

        console.error(
          "ERROR DETAIL ORDER ARTIKEL:",
          error
        );


        penulis.innerHTML =
          `
          <option value="">
            Gagal memuat Penulis
          </option>
          `;


        alert(
          "Gagal mengambil data order artikel:\n" +
          (
            error &&
            error.message
              ? error.message
              : error
          )
        );

      }
    )

    .ambilOrderArtikelUntukInvoice(
      idOrder
    );

}


/* ==================================================
   FALLBACK AMBIL PENULIS BERDASARKAN ID ORDER
================================================== */

function ambilPenulisBerdasarkanOrder(
  idOrder
){

  const penulis =
    document.getElementById(
      "idPenulis"
    );


  penulis.innerHTML =
    `
    <option value="">
      Memuat Penulis...
    </option>
    `;


  if(
    typeof google === "undefined" ||
    !google.script ||
    !google.script.run
  ){

    return;

  }


  /*
   * Fungsi backend yang dicoba:
   *
   * ambilPenulisBerdasarkanOrder
   *
   * Jika fungsi ini belum ada di Code.gs,
   * lihat catatan di bawah.
   */

  google.script.run

    .withSuccessHandler(
      function(data){

        console.log(
          "PENULIS BERDASARKAN ORDER:",
          data
        );


        let daftarPenulis =
          data;


        if(
          data &&
          !Array.isArray(data) &&
          Array.isArray(data.data)
        ){

          daftarPenulis =
            data.data;

        }


        if(
          !Array.isArray(daftarPenulis) ||
          daftarPenulis.length === 0
        ){

          penulis.innerHTML =
            `
            <option value="">
              Belum ada Penulis untuk Order ini
            </option>
            `;

          return;

        }


        isiDropdownPenulis(
          daftarPenulis
        );

      }
    )

    .withFailureHandler(
      function(error){

        console.error(
          "ERROR PENULIS BERDASARKAN ORDER:",
          error
        );


        penulis.innerHTML =
          `
          <option value="">
            Belum ada Penulis
          </option>
          `;

      }
    )

    .ambilPenulisBerdasarkanOrder(
      idOrder
    );

}


/* ==================================================
   ISI DROPDOWN PENULIS
================================================== */

function isiDropdownPenulis(
  daftarPenulis
){

  const select =
    document.getElementById(
      "idPenulis"
    );


  select.innerHTML =
    `
    <option value="">
      Pilih Penulis
    </option>
    `;


  if(
    !Array.isArray(daftarPenulis) ||
    daftarPenulis.length === 0
  ){

    select.innerHTML =
      `
      <option value="">
        Belum ada Penulis
      </option>
      `;

    return;

  }


  daftarPenulis.forEach(
    function(item,index){

      if(!item){
        return;
      }


      /*
       * ==========================================
       * ID PENULIS
       * ==========================================
       */

      const idPenulis =
        item.idPenulis ||
        item.ID_Penulis ||
        item.id ||
        item.authorId ||
        item["ID Penulis"] ||
        "";


      /*
       * ==========================================
       * NAMA PENULIS
       * ==========================================
       */

      const namaPenulis =
        item.namaPenulis ||
        item.nama ||
        item.nama_author ||
        item["Nama Penulis"] ||
        "";


      /*
       * ==========================================
       * PENULIS KE-
       * ==========================================
       */

      const penulisKe =
        item.penulisKe ||
        item.urutan ||
        item.nomorPenulis ||
        item["Penulis Ke"] ||
        (index + 1);


      /*
       * Kalau ID Penulis kosong,
       * jangan masukkan option.
       */

      if(!idPenulis){

        console.warn(
          "Penulis tidak memiliki ID:",
          item
        );

        return;

      }


      const option =
        document.createElement(
          "option"
        );


      option.value =
        idPenulis;


      option.textContent =
        idPenulis +
        (
          namaPenulis
            ? " — " + namaPenulis
            : ""
        );


      /*
       * Simpan data sementara di option.
       */

      option.dataset.penulisKe =
        penulisKe;


      option.dataset.nama =
        namaPenulis;


      select.appendChild(
        option
      );

    }
  );


  /*
   * Jika ternyata tidak ada option
   */

  if(
    select.options.length === 1
  ){

    select.innerHTML =
      `
      <option value="">
        Belum ada Penulis
      </option>
      `;

  }

}


/* ==================================================
   DETAIL PENULIS
================================================== */

function ambilDetailPenulis(){

  const select =
    document.getElementById(
      "idPenulis"
    );


  const nama =
    document.getElementById(
      "namaPenulis"
    );


  const penulisKe =
    document.getElementById(
      "penulisKe"
    );


  const option =
    select.options[
      select.selectedIndex
    ];


  nama.value = "";

  penulisKe.value = "";


  if(
    !option ||
    !option.value
  ){

    return;

  }


  const idPenulis =
    option.value;


  /*
   * ==========================================
   * TAMPILKAN DATA DARI OPTION TERLEBIH DAHULU
   * ==========================================
   */

  nama.value =
    option.dataset.nama ||
    "";


  penulisKe.value =
    option.dataset.penulisKe ||
    "";


  console.log(
    "AMBIL DETAIL PENULIS:",
    idPenulis
  );


  /*
   * ==========================================
   * AMBIL DETAIL PENULIS DARI CODE.GS
   * ==========================================
   *
   * ID Penulis adalah kunci utama.
   */

  if(
    typeof google === "undefined" ||
    !google.script ||
    !google.script.run
  ){

    return;

  }


  google.script.run

    .withSuccessHandler(
      function(data){

        console.log(
          "DETAIL PENULIS:",
          data
        );


        if(!data){

          return;

        }


        if(
          data.success === false
        ){

          console.warn(
            data.message ||
            "Detail Penulis tidak ditemukan."
          );

          return;

        }


        /*
         * Nama Penulis
         */

        nama.value =
          data.namaPenulis ||
          data.nama ||
          data["Nama Penulis"] ||
          nama.value ||
          "";


        /*
         * Penulis ke-
         */

        penulisKe.value =
          data.penulisKe ||
          data.urutan ||
          data.nomorPenulis ||
          data["Penulis Ke"] ||
          penulisKe.value ||
          "";

      }
    )

    .withFailureHandler(
      function(error){

        console.error(
          "ERROR DETAIL PENULIS:",
          error
        );

        /*
         * Jangan hapus data yang sudah ada
         * dari dropdown.
         */

      }
    )

    .ambilDetailPenulisArtikel(
      idPenulis
    );

}


/* ==================================================
   STATUS PEMBAYARAN
================================================== */

function ubahStatusPembayaran(){

  const status =
    document.getElementById(
      "statusPembayaran"
    ).value;


  const label =
    document.getElementById(
      "labelNominal"
    );


  const deskripsi =
    document.getElementById(
      "deskripsiNominal"
    );


  if(status === "DP"){

    label.textContent =
      "Nominal DP";

    deskripsi.textContent =
      "Masukkan nominal pembayaran DP.";

  }

  else if(status === "Pelunasan"){

    label.textContent =
      "Nominal Pelunasan";

    deskripsi.textContent =
      "Masukkan nominal pembayaran pelunasan.";

  }

  else if(status === "Lunas"){

    label.textContent =
      "Nominal Lunas";

    deskripsi.textContent =
      "Masukkan nominal pembayaran lunas.";

  }

  else{

    label.textContent =
      "Nominal Pembayaran";

    deskripsi.textContent =
      "Nominal pembayaran sesuai transaksi.";

  }

}


/* ==================================================
   SIMPAN INVOICE
================================================== */

function simpanInvoice(event){

  event.preventDefault();


  const form =
    document.getElementById(
      "invoiceForm"
    );


  if(!form.checkValidity()){

    form.reportValidity();

    return;

  }


  const btn =
    document.getElementById(
      "btnSimpan"
    );


  const loading =
    document.getElementById(
      "loading"
    );


  const data = {

    idOrder:
      document.getElementById(
        "idOrder"
      ).value,

    kodeJurnal:
      document.getElementById(
        "kodeJurnal"
      ).value,

    bulanTerbit:
      document.getElementById(
        "bulanTerbit"
      ).value,

    judulArtikel:
      document.getElementById(
        "judulArtikel"
      ).value,

    idPenulis:
      document.getElementById(
        "idPenulis"
      ).value,

    penulisKe:
      document.getElementById(
        "penulisKe"
      ).value,

    namaPenulis:
      document.getElementById(
        "namaPenulis"
      ).value,

    marketingInput:
      document.getElementById(
        "marketingInput"
      ).value,

    tanggal:
      document.getElementById(
        "tanggal"
      ).value,

    harga:
      document.getElementById(
        "harga"
      ).value,

    statusPembayaran:
      document.getElementById(
        "statusPembayaran"
      ).value,

    nominal:
      document.getElementById(
        "nominal"
      ).value

  };


  /*
   * ==========================================
   * VALIDASI
   * ==========================================
   */

  if(!data.idOrder){

    alert(
      "Silakan pilih ID Order Artikel."
    );

    return;

  }


  if(!data.idPenulis){

    alert(
      "Silakan pilih Penulis."
    );

    return;

  }


  if(!data.namaPenulis){

    alert(
      "Nama Penulis belum ditemukan."
    );

    return;

  }


  if(!data.marketingInput){

    alert(
      "Silakan pilih Marketing Input."
    );

    return;

  }


  if(!data.statusPembayaran){

    alert(
      "Silakan pilih Status Pembayaran."
    );

    return;

  }


  if(
    data.harga === "" ||
    Number(data.harga) < 0
  ){

    alert(
      "Harga belum diisi dengan benar."
    );

    return;

  }


  if(
    data.nominal === "" ||
    Number(data.nominal) < 0
  ){

    alert(
      "Nominal pembayaran belum diisi dengan benar."
    );

    return;

  }


  /*
   * ==========================================
   * LOADING
   * ==========================================
   */

  btn.disabled = true;

  btn.textContent =
    "MENYIMPAN...";

  loading.classList.add(
    "active"
  );


  /*
   * ==========================================
   * SIMPAN KE CODE.GS
   * ==========================================
   */

  google.script.run

    .withSuccessHandler(
      function(result){

        btn.disabled = false;

        btn.textContent =
          "SIMPAN INVOICE ARTIKEL";

        loading.classList.remove(
          "active"
        );


        if(
          result &&
          result.success
        ){

          document.getElementById(
            "nomorInvoice"
          ).textContent =
            result.idInvoice ||
            "-";


          document.getElementById(
            "detailInvoice"
          ).innerHTML =

            "ID Order: <strong>" +
            escapeHtml(
              data.idOrder
            ) +
            "</strong><br>" +

            "Kode Jurnal: <strong>" +
            escapeHtml(
              data.kodeJurnal
            ) +
            "</strong><br>" +

            "Bulan Terbit: <strong>" +
            escapeHtml(
              data.bulanTerbit
            ) +
            "</strong><br>" +

            "Judul Artikel: <strong>" +
            escapeHtml(
              data.judulArtikel
            ) +
            "</strong><br>" +

            "ID Penulis: <strong>" +
            escapeHtml(
              data.idPenulis
            ) +
            "</strong><br>" +

            "Penulis ke-" +
            escapeHtml(
              data.penulisKe
            ) +
            ": <strong>" +
            escapeHtml(
              data.namaPenulis
            ) +
            "</strong><br>" +

            "Marketing: <strong>" +
            escapeHtml(
              data.marketingInput
            ) +
            "</strong><br>" +

            "Status: <strong>" +
            escapeHtml(
              data.statusPembayaran
            ) +
            "</strong><br>" +

            "Nominal: <strong>Rp " +
            formatRupiah(
              data.nominal
            ) +
            "</strong>";


          document.getElementById(
            "popupBerhasil"
          ).classList.add(
            "active"
          );


          /*
           * RESET FORM
           */

          form.reset();


          /*
           * Tanggal kembali hari ini
           */

          document.getElementById(
            "tanggal"
          ).value =
            new Date()
              .toISOString()
              .split("T")[0];


          /*
           * Reset field readonly
           */

          document.getElementById(
            "kodeJurnal"
          ).value = "";

          document.getElementById(
            "bulanTerbit"
          ).value = "";

          document.getElementById(
            "judulArtikel"
          ).value = "";

          document.getElementById(
            "penulisKe"
          ).value = "";

          document.getElementById(
            "namaPenulis"
          ).value = "";


          /*
           * Reset dropdown Penulis
           */

          document.getElementById(
            "idPenulis"
          ).innerHTML =
            `
            <option value="">
              Pilih Penulis
            </option>
            `;

        }

        else{

          alert(
            (
              result &&
              result.message
            ) ||
            "Gagal menyimpan invoice artikel."
          );

        }

      }
    )

    .withFailureHandler(
      function(error){

        btn.disabled = false;

        btn.textContent =
          "SIMPAN INVOICE ARTIKEL";

        loading.classList.remove(
          "active"
        );


        console.error(
          "ERROR SIMPAN INVOICE ARTIKEL:",
          error
        );


        alert(
          "Gagal menyimpan invoice artikel:\n" +
          (
            error &&
            error.message
              ? error.message
              : error
          )
        );

      }
    )

    .simpanInvoiceArtikel(
      data
    );

}


/* ==================================================
   FORMAT RUPIAH
================================================== */

function formatRupiah(angka){

  return new Intl.NumberFormat(
    "id-ID"
  ).format(
    Number(angka) || 0
  );

}


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHtml(text){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ==================================================
   TUTUP POPUP
================================================== */

function tutupPopup(){

  document.getElementById(
    "popupBerhasil"
  ).classList.remove(
    "active"
  );

}


/* ==================================================
   KEMBALI
================================================== */

function kembali(){

  window.location.href =
    "artikel.html";

}

</script>
