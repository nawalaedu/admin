<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ISBN Buku</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fa;
  color:#183b56;
}

.header{
  background:linear-gradient(135deg,#183b56,#2f6f95);
  color:white;
  padding:22px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.container{
  max-width:850px;
  margin:40px auto;
  padding:0 20px;
}

.back{
  background:#718096;
  color:white;
  border:0;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
  margin-bottom:20px;
}

.form-card{
  background:white;
  padding:35px;
  border-radius:18px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.form-title{
  margin-bottom:30px;
}

.form-title h1{
  margin:0 0 8px;
}

.form-title p{
  color:#718096;
  line-height:1.5;
}

.form-group{
  margin-bottom:20px;
}

label{
  display:block;
  font-size:14px;
  font-weight:bold;
  margin-bottom:8px;
}

input,
select{
  width:100%;
  padding:13px;
  border:1px solid #d6dee6;
  border-radius:9px;
  font-size:14px;
  background:white;
}

input:focus,
select:focus{
  outline:none;
  border-color:#2f6f95;
}

.readonly{
  background:#f1f5f9;
}

small{
  display:block;
  margin-top:7px;
  color:#718096;
  line-height:1.5;
}

.info-box{
  background:#f0f7fb;
  border-left:4px solid #2f6f95;
  padding:15px;
  border-radius:8px;
  margin-bottom:25px;
  font-size:14px;
  line-height:1.6;
}

.btn-save{
  width:100%;
  border:0;
  padding:14px;
  border-radius:9px;
  background:#183b56;
  color:white;
  font-weight:bold;
  cursor:pointer;
  font-size:14px;
}

.btn-save:hover{
  background:#2f6f95;
}

.btn-save:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

.loading{
  display:none;
  text-align:center;
  margin-top:15px;
  color:#718096;
}

.loading.active{
  display:block;
}

.status-order{
  display:none;
  margin-top:8px;
  padding:9px 12px;
  border-radius:8px;
  background:#f1f5f9;
  color:#718096;
  font-size:13px;
}

.status-order.show{
  display:block;
}

</style>


<!-- =====================================================
     API.JS
===================================================== -->

<script src="api.js"></script>

</head>


<body>


<header class="header">

<div>
ADMIN MANAGEMENT
</div>

<div>
ISBN
</div>

</header>


<div class="container">


<button
type="button"
class="back"
onclick="kembali()">

← Kembali ke Buku

</button>


<div class="form-card">


<div class="form-title">

<h1>
🔖 Form ISBN
</h1>

<p>
Kelola data ISBN berdasarkan order buku.
</p>

</div>


<div class="info-box">

<strong>Informasi:</strong><br>

Pilih ID Order untuk menghubungkan data ISBN
dengan buku yang sesuai.

</div>


<form
id="isbnForm"
onsubmit="simpanISBN(event)">


<!-- =====================================================
     ID ORDER
===================================================== -->

<div class="form-group">

<label for="idOrder">
ID Order Buku
</label>


<select
id="idOrder"
required
onchange="ambilDetailOrder()">

<option value="">
⏳ Memuat ID Order...
</option>

</select>


<small>
Pilih ID Order dari order buku yang telah dibuat.
</small>


<div
id="statusOrder"
class="status-order">
</div>

</div>


<!-- =====================================================
     JUDUL BUKU
===================================================== -->

<div class="form-group">

<label for="judulBuku">
Judul Buku
</label>

<input
type="text"
id="judulBuku"
class="readonly"
placeholder="Otomatis berdasarkan ID Order"
readonly>

</div>


<!-- =====================================================
     TIM RISET
===================================================== -->

<div class="form-group">

<label for="timRiset">
Nama Tim Riset
</label>

<select
id="timRiset"
required>

<option value="">
Pilih Tim Riset
</option>

<option value="Tim Riset 1">
Tim Riset 1
</option>

<option value="Tim Riset 2">
Tim Riset 2
</option>

<option value="Tim Riset 3">
Tim Riset 3
</option>

<option value="Tim Riset 4">
Tim Riset 4
</option>

</select>

</div>


<!-- =====================================================
     NOMOR ISBN
===================================================== -->

<div class="form-group">

<label for="nomorISBN">
Nomor ISBN
</label>

<input
type="text"
id="nomorISBN"
placeholder="Masukkan nomor ISBN"
required>

</div>


<!-- =====================================================
     ARSIP
===================================================== -->

<div class="form-group">

<label for="arsip">
Arsip
</label>

<input
type="url"
id="arsip"
placeholder="Masukkan link Google Drive"
required>

<small>
Masukkan link Google Drive yang berisi
arsip dokumen ISBN.
</small>

</div>


<!-- =====================================================
     SIMPAN
===================================================== -->

<button
type="submit"
id="btnSimpan"
class="btn-save">

SIMPAN ISBN

</button>


<div
id="loading"
class="loading">

⏳ Menyimpan data ISBN...

</div>


</form>

</div>

</div>


<script>


/* =========================================================
   SAAT HALAMAN DIBUKA
========================================================= */

document.addEventListener(
"DOMContentLoaded",
function(){

  console.log(
    "ISBN: halaman berhasil dimuat."
  );

  /*
   * LANGSUNG LOAD ID ORDER BUKU
   */
  muatDaftarOrder();

});


/* =========================================================
   LOAD DAFTAR ID ORDER BUKU
========================================================= */

function muatDaftarOrder(){

  const select =
    document.getElementById(
      "idOrder"
    );

  const status =
    document.getElementById(
      "statusOrder"
    );


  /*
   * Reset dropdown
   */

  select.innerHTML =
    '<option value="">⏳ Mengambil ID Order Buku...</option>';


  status.textContent =
    "";

  status.classList.remove(
    "show"
  );


  console.log(
    "ISBN: memanggil ambilDaftarOrderBuku()"
  );


  /*
   * =====================================================
   * PANGGIL API
   *
   * Code.gs:
   *
   * case 'ambilDaftarOrderBuku':
   *   return getOrderList(
   *      CONFIG.DB.BUKU,
   *      CONFIG.SHEET.BUKU_ORDER
   *   );
   * =====================================================
   */

  google.script.run

  .withSuccessHandler(
    function(result){

      console.log(
        "ISBN: hasil ambilDaftarOrderBuku:",
        result
      );


      /*
       * Bersihkan dropdown
       */

      select.innerHTML =
        '<option value="">Pilih ID Order</option>';


      /*
       * getOrderList() mengembalikan
       * ARRAY secara langsung.
       */

      if(!Array.isArray(result)){

        console.error(
          "ISBN: response bukan array:",
          result
        );


        select.innerHTML =
          '<option value="">Data Order tidak valid</option>';


        status.textContent =
          "Response API tidak berupa daftar order.";


        status.classList.add(
          "show"
        );


        return;

      }


      /*
       * Tidak ada data
       */

      if(result.length === 0){

        select.innerHTML =
          '<option value="">Tidak ada ID Order</option>';


        status.textContent =
          "Tidak ditemukan order buku.";


        status.classList.add(
          "show"
        );


        console.warn(
          "ISBN: ORDER BUKU kosong."
        );


        return;

      }


      let jumlah =
        0;


      /*
       * Masukkan order satu per satu
       */

      result.forEach(
        function(order){

          if(!order){
            return;
          }


          /*
           * Code.gs mengharapkan:
           *
           * idOrder
           */

          const idOrder =
            String(
              order.idOrder || ""
            ).trim();


          /*
           * Kalau tidak ada idOrder
           * jangan dimasukkan.
           */

          if(!idOrder){

            console.warn(
              "Order tanpa idOrder:",
              order
            );

            return;

          }


          const option =
            document.createElement(
              "option"
            );


          /*
           * VALUE = ID ORDER
           */

          option.value =
            idOrder;


          /*
           * Ambil judul
           */

          const judul =
            order.judulBuku ||
            order.judul ||
            "";


          /*
           * Yang terlihat:
           *
           * ORD/BUK/0001 - Judul Buku
           */

          if(judul){

            option.textContent =
              idOrder +
              " - " +
              judul;

          }

          else{

            option.textContent =
              idOrder;

          }


          /*
           * Tambahkan ke dropdown
           */

          select.appendChild(
            option
          );


          jumlah++;

        }
      );


      /*
       * Status
       */

      if(jumlah > 0){

        status.textContent =
          jumlah +
          " ID Order berhasil dimuat.";


        status.classList.add(
          "show"
        );


        console.log(
          "ISBN:",
          jumlah,
          "ID Order berhasil dimuat."
        );

      }

      else{

        select.innerHTML =
          '<option value="">Tidak ada ID Order valid</option>';


        status.textContent =
          "Order ditemukan tetapi kolom idOrder tidak terbaca.";


        status.classList.add(
          "show"
        );


        console.warn(
          "ISBN: semua order tidak memiliki property idOrder."
        );

      }

    }
  )


  .withFailureHandler(
    function(error){

      console.error(
        "ISBN: error ambilDaftarOrderBuku:",
        error
      );


      select.innerHTML =
        '<option value="">Gagal mengambil ID Order</option>';


      status.textContent =
        "Gagal mengambil data order.";


      status.classList.add(
        "show"
      );


      alert(
        "Gagal mengambil ID Order Buku.\n\n" +
        (
          error &&
          error.message
            ? error.message
            : String(error)
        )
      );

    }
  )


  /*
   * METHOD KHUSUS BUKU
   *
   * JANGAN diganti menjadi
   * ambilDaftarOrder()
   */

  .ambilDaftarOrderBuku();

}


/* =========================================================
   AMBIL DETAIL ORDER
========================================================= */

function ambilDetailOrder(){

  const idOrder =
    String(
      document.getElementById(
        "idOrder"
      ).value || ""
    ).trim();


  const judul =
    document.getElementById(
      "judulBuku"
    );


  /*
   * Kosongkan judul
   */

  judul.value =
    "";


  /*
   * Kalau belum memilih order
   */

  if(!idOrder){

    return;

  }


  console.log(
    "ISBN: mengambil detail order:",
    idOrder
  );


  /*
   * =====================================================
   * PANGGIL DETAIL ORDER BUKU
   * =====================================================
   */

  google.script.run

  .withSuccessHandler(
    function(data){

      console.log(
        "ISBN: detail order:",
        data
      );


      if(!data){

        alert(
          "ID Order tidak ditemukan:\n\n" +
          idOrder
        );

        return;

      }


      /*
       * Isi judul
       */

      judul.value =
        data.judulBuku ||
        data.judul ||
        "";


      /*
       * Kalau judul kosong
       */

      if(!judul.value){

        console.warn(
          "Order ditemukan tetapi judul buku kosong."
        );

      }

    }
  )


  .withFailureHandler(
    function(error){

      console.error(
        "ISBN: error detail order:",
        error
      );


      alert(
        "Gagal mengambil detail ID Order.\n\n" +
        (
          error &&
          error.message
            ? error.message
            : String(error)
        )
      );

    }
  )


  /*
   * METHOD KHUSUS BUKU
   */

  .ambilDetailOrderBuku(
    idOrder
  );

}


/* =========================================================
   SIMPAN ISBN
========================================================= */

function simpanISBN(event){

  event.preventDefault();


  const btn =
    document.getElementById(
      "btnSimpan"
    );


  const loading =
    document.getElementById(
      "loading"
    );


  /*
   * Ambil data form
   */

  const data = {

    idOrder:
      String(
        document.getElementById(
          "idOrder"
        ).value || ""
      ).trim(),

    judulBuku:
      document.getElementById(
        "judulBuku"
      ).value,

    timRiset:
      document.getElementById(
        "timRiset"
      ).value,

    nomorISBN:
      document.getElementById(
        "nomorISBN"
      ).value,

    arsip:
      document.getElementById(
        "arsip"
      ).value

  };


  console.log(
    "ISBN: data yang akan disimpan:",
    data
  );


  /*
   * VALIDASI ID ORDER
   */

  if(!data.idOrder){

    alert(
      "Silakan pilih ID Order Buku terlebih dahulu."
    );

    return;

  }


  /*
   * VALIDASI TIM RISET
   */

  if(!data.timRiset){

    alert(
      "Silakan pilih Tim Riset."
    );

    return;

  }


  /*
   * VALIDASI ISBN
   */

  if(!data.nomorISBN){

    alert(
      "Silakan masukkan Nomor ISBN."
    );

    return;

  }


  /*
   * VALIDASI ARSIP
   */

  if(!data.arsip){

    alert(
      "Silakan masukkan link Arsip."
    );

    return;

  }


  /*
   * LOADING
   */

  btn.disabled =
    true;

  btn.textContent =
    "MENYIMPAN...";

  loading.classList.add(
    "active"
  );


  /*
   * =====================================================
   * SIMPAN KE CODE.GS
   * =====================================================
   *
   * Code.gs:
   *
   * case 'simpanISBN':
   *   return save(
   *      CONFIG.DB.BUKU,
   *      CONFIG.SHEET.BUKU_ISBN,
   *      args[0],
   *      'ISBN/'
   *   );
   *
   */

  google.script.run

  .withSuccessHandler(
    function(result){

      console.log(
        "ISBN: hasil simpan:",
        result
      );


      /*
       * Kembalikan tombol
       */

      btn.disabled =
        false;

      btn.textContent =
        "SIMPAN ISBN";

      loading.classList.remove(
        "active"
      );


      /*
       * BERHASIL
       */

      if(
        result &&
        result.success
      ){

        alert(
          "Data ISBN berhasil disimpan.\n\n" +

          "ID Order: " +
          data.idOrder +

          "\nJudul Buku: " +
          data.judulBuku +

          "\nNomor ISBN: " +
          data.nomorISBN
        );


        /*
         * Reset form
         */

        document.getElementById(
          "isbnForm"
        ).reset();


        /*
         * Judul dikosongkan
         */

        document.getElementById(
          "judulBuku"
        ).value =
          "";


        /*
         * Muat ulang daftar order
         */

        muatDaftarOrder();

      }

      else{

        alert(
          "Gagal menyimpan ISBN.\n\n" +

          (
            result &&
            result.message
              ? result.message
              : "Error tidak diketahui."
          )
        );

      }

    }
  )


  .withFailureHandler(
    function(error){

      console.error(
        "ISBN: error simpan:",
        error
      );


      btn.disabled =
        false;

      btn.textContent =
        "SIMPAN ISBN";

      loading.classList.remove(
        "active"
      );


      alert(
        "Gagal menyimpan ISBN.\n\n" +
        (
          error &&
          error.message
            ? error.message
            : String(error)
        )
      );

    }
  )


  /*
   * METHOD YANG ADA DI CODE.GS UTAMA
   */

  .simpanISBN(
    data
  );

}


/* =========================================================
   KEMBALI KE BUKU
========================================================= */

function kembali(){

  window.location.href =
    "buku.html";

}

</script>

</body>
</html>
